[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autourgos-cua-coordinate-tool"
version = "1.0.2"
description = "LLM-grounded UI coordinate finding for Autourgos computer-use agents — locates a described UI element in a screenshot and returns its position normalized to a 0-1000 scale (Gemini computer-use's coordinate convention)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    {name = "Jitin Kumar Sengar", email = "devxjitin@gmail.com"}
]
maintainers = [
    {name = "Sonia"},
    {name = "Vishwanil Suman"},
]
keywords = ["autourgos", "agent", "computer-use", "cua", "coordinates", "grounding", "vision", "llm", "gui-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["autourgos-agent>=3.1.1", "autourgos-core>=0.3.0"]

[project.optional-dependencies]
images = ["Pillow>=9.0"]
capture = ["mss>=9.0"]
all = ["Pillow>=9.0", "mss>=9.0"]
dev = ["pytest>=7.0", "Pillow>=9.0", "mss>=9.0"]

[project.urls]
Homepage = "https://github.com/devxjitin/autourgos-cua-coordinate-tool"
Repository = "https://github.com/devxjitin/autourgos-cua-coordinate-tool"
Issues = "https://github.com/devxjitin/autourgos-cua-coordinate-tool/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autourgos_cua_coordinate_tool*"]

[tool.setuptools.package-data]
autourgos_cua_coordinate_tool = ["py.typed"]
